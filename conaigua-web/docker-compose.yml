services:
  frontend:
    image: node:lts
    container_name: conaigua-frontend
    working_dir: /workspace/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - pnpm_store:/pnpm/store
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    stdin_open: true
    tty: true
    command: sh -c "corepack enable && pnpm run dev --host 0.0.0.0"

volumes:
  pnpm_store: